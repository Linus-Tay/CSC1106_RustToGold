<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}RustToGold | Secure Digital Banking{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}RustToGold is a secure academic banking simulation for product-first account, fixed deposit, personal loan, credit card, FX card, security, and role-based access workflows.{% endblock %}" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />

  <script>
    tailwind = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "system-ui", "sans-serif"],
            heading: ["Manrope", "Inter", "system-ui", "sans-serif"]
          },
          colors: {
            primary: "var(--color-primary)",
            primary2: "var(--color-primary-2)",
            blueBank: "var(--color-blue)",
            skyBank: "var(--color-sky)",
            gold: "var(--color-gold)",
            emeraldBank: "var(--color-emerald)",
            page: "var(--color-page)",
            surface: "var(--color-surface)",
            surface2: "var(--color-surface-2)",
            ink: "var(--color-ink)",
            muted: "var(--color-muted)",
            borderSoft: "var(--color-border)"
          },
          boxShadow: {
            soft: "0 18px 50px rgba(15, 23, 42, 0.10)",
            glow: "0 26px 80px rgba(7, 27, 51, 0.25)",
            blue: "0 20px 50px rgba(37, 99, 235, 0.22)",
            gold: "0 20px 48px rgba(214, 165, 74, 0.26)"
          },
          borderRadius: {
            card: "1.5rem",
            hero: "2rem"
          }
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="/static/css/public.css" />
</head>
<body class="min-h-screen bg-page text-ink antialiased">
  {% include "partials/public_nav.html" %}

  {% block content %}{% endblock %}

  {% include "partials/public_footer.html" %}

  <script>
    (function () {
      document.documentElement.classList.add('js');

      const DESKTOP_MIN = 1121;
      const nav = document.querySelector('[data-public-nav]');

      function createIcons() {
        if (window.lucide) window.lucide.createIcons();
      }

      if (nav) {
        const triggers = Array.from(nav.querySelectorAll('[data-mega-trigger]'));
        const panels = Array.from(nav.querySelectorAll('[data-mega-panel]'));
        const mobileOpenButton = nav.querySelector('[data-mobile-menu-open]');
        const mobileCloseButtons = Array.from(nav.querySelectorAll('[data-mobile-menu-close]'));
        const mobileDrawer = nav.querySelector('[data-mobile-drawer]');
        const drawerLinks = Array.from(nav.querySelectorAll('.mobile-drawer a'));
        let closeTimer = null;

        function isDesktopNav() {
          return window.innerWidth >= DESKTOP_MIN;
        }

        function closePanels() {
          panels.forEach((panel) => panel.classList.remove('is-open'));
          triggers.forEach((trigger) => {
            trigger.classList.remove('is-active');
            trigger.setAttribute('aria-expanded', 'false');
          });
        }

        function openPanel(name) {
          if (!isDesktopNav()) return;
          closeMobileMenu(false);
          window.clearTimeout(closeTimer);

          panels.forEach((panel) => {
            panel.classList.toggle('is-open', panel.dataset.megaPanel === name);
          });

          triggers.forEach((trigger) => {
            const active = trigger.dataset.megaTrigger === name;
            trigger.classList.toggle('is-active', active);
            trigger.setAttribute('aria-expanded', active ? 'true' : 'false');
          });
        }

        function queueClosePanels() {
          window.clearTimeout(closeTimer);
          closeTimer = window.setTimeout(closePanels, 130);
        }

        function openMobileMenu() {
          closePanels();
          nav.classList.add('is-mobile-open');
          document.body.classList.add('mobile-nav-open');
          mobileOpenButton?.setAttribute('aria-expanded', 'true');
          mobileDrawer?.setAttribute('aria-hidden', 'false');

          const closeButton = nav.querySelector('[data-mobile-menu-close]:not(.mobile-drawer-overlay)');
          window.setTimeout(() => closeButton?.focus({ preventScroll: true }), 80);
        }

        function closeMobileMenu(returnFocus = false) {
          nav.classList.remove('is-mobile-open');
          document.body.classList.remove('mobile-nav-open');
          mobileOpenButton?.setAttribute('aria-expanded', 'false');
          mobileDrawer?.setAttribute('aria-hidden', 'true');
          if (returnFocus) mobileOpenButton?.focus({ preventScroll: true });
        }

        triggers.forEach((trigger) => {
          const name = trigger.dataset.megaTrigger;

          trigger.addEventListener('mouseenter', () => openPanel(name));
          trigger.addEventListener('focus', () => openPanel(name));
          trigger.addEventListener('click', (event) => {
            event.preventDefault();
            const isOpen = trigger.getAttribute('aria-expanded') === 'true';
            isOpen ? closePanels() : openPanel(name);
          });
        });

        panels.forEach((panel) => {
          panel.addEventListener('mouseenter', () => window.clearTimeout(closeTimer));
          panel.addEventListener('mouseleave', queueClosePanels);
        });

        mobileOpenButton?.addEventListener('click', (event) => {
          event.preventDefault();
          event.stopPropagation();
          openMobileMenu();
        });

        mobileCloseButtons.forEach((button) => {
          button.addEventListener('click', (event) => {
            event.preventDefault();
            closeMobileMenu(true);
          });
        });

        drawerLinks.forEach((link) => {
          link.addEventListener('click', () => closeMobileMenu(false));
        });

        nav.addEventListener('mouseleave', () => {
          if (isDesktopNav()) queueClosePanels();
        });

        document.addEventListener('click', (event) => {
          if (!nav.contains(event.target)) {
            closePanels();
            closeMobileMenu(false);
          }
        });

        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') {
            closePanels();
            closeMobileMenu(true);
          }
        });

        window.addEventListener('resize', () => {
          if (isDesktopNav()) closeMobileMenu(false);
          else closePanels();
        });
      }

      const revealItems = Array.from(document.querySelectorAll('[data-reveal]'));
      if ('IntersectionObserver' in window && revealItems.length) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.14, rootMargin: '0px 0px -40px 0px' });

        revealItems.forEach((item, index) => {
          item.style.setProperty('--reveal-delay', `${Math.min(index * 55, 220)}ms`);
          observer.observe(item);
        });
      } else {
        revealItems.forEach((item) => item.classList.add('is-visible'));
      }

      createIcons();
    })();
  </script>
</body>
</html>
