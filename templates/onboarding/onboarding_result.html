<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RustToGold – Basic Details</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="stylesheet" href="/static/css/onboarding.css"/>
  <style>
  </style>
</head>
<body>

  <nav class="c-navbar" aria-label="Primary navigation">
  <div class="u-container c-navbar__inner">
    <a class="c-navbar__brand" href="" data-route="/">
      <span class="c-navbar__logo-wrap" aria-hidden="true">
        <img class="c-navbar__logo-img" src="/static/images/rusttogold-logo.png" alt="" />
      </span>
      <span>RustToGold</span>
    </a>
  </div>
</nav>

<div class="app-body">
  <aside>
    <div class="step-item">
      <div class="step-circle">1</div>
      <div>
        <div class="step-label">Step 1</div>
        <div class="step-name">Basic Details</div>
      </div>
    </div>
    <div class="step-item active">
      <div class="step-circle">2</div>
      <div>
        <div class="step-label">Step 2</div>
        <div class="step-name">Additional Details</div>
      </div>
    </div>
    <div class="step-item">
      <div class="step-circle">3</div>
      <div>
        <div class="step-label">Step 3</div>
        <div class="step-name">Account Details</div>
      </div>
    </div>
    <div class="step-item">
      <div class="step-circle">4</div>
      <div>
        <div class="step-label">Step 4</div>
        <div class="step-name">Declarations</div>
      </div>
    </div>
    <div class="step-item">
      <div class="step-circle">5</div>
      <div>
        <div class="step-label">Step 5</div>
        <div class="step-name">Review</div>
      </div>
    </div>
    <div class="step-item">
      <div class="step-circle">6</div>
      <div>
        <div class="step-label">Step 6</div>
        <div class="step-name">Customer Verification</div>
      </div>
    </div>
    <div class="step-item">
      <div class="step-circle">7</div>
      <div>
        <div class="step-label">Step 7</div>
        <div class="step-name">Before Submission</div>
      </div>
    </div>
  </aside>

  <main>
    <h1>Application Submission Result</h1>
    <p class="result-message">{{ result_message }}</p>
  </main>
</div>

</body>
</html>
