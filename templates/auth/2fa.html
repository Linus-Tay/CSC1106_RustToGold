<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RustToGold | Security Check</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              600: '#1e3a8a', 
              900: '#0f172a',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 font-sans text-slate-900 antialiased min-h-screen flex flex-col">

  <main class="flex-grow flex items-center justify-center p-4 sm:p-6">
    <div class="w-full max-w-md">
      
      <a class="inline-flex items-center gap-2 text-sm text-slate-500 hover:text-navy-600 mb-6 transition-colors" href="/login">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to login
      </a>

      <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        
        <div class="px-6 py-8 border-b border-slate-100">
          <p class="text-xs font-semibold tracking-wider text-slate-500 uppercase mb-2">Security Check</p>
          <h1 class="text-2xl font-bold text-slate-900 mb-2">Two-Factor Auth</h1>
          <p class="text-slate-500 text-sm leading-relaxed">
            We don't recognize this device. Please enter the 6-digit code sent to your registered contact method.
          </p>
        </div>

        <div class="px-6 py-6 sm:p-8">
          
          {% if has_error %}
          <div class="flex items-start gap-3 p-4 mb-6 text-sm text-red-700 bg-red-50 rounded-lg border border-red-200">
            <i data-lucide="circle-alert" class="w-5 h-5 shrink-0 mt-0.5"></i>
            <p>{{ error }}</p>
          </div>
          {% endif %}

          <form action="/verify-2fa" method="post" class="space-y-6">
            
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-2" for="verification_code">
                Verification Code
              </label>
              <input 
                class="w-full px-4 py-3 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-navy-600 focus:border-navy-600 outline-none transition-colors text-2xl tracking-[0.5em] text-center font-mono placeholder:text-slate-300" 
                id="code" 
                name="code" 
                inputmode="numeric" 
                pattern="\d{6}" 
                maxlength="6" 
                autocomplete="one-time-code" 
                placeholder="000000" 
                required 
                autofocus 
              />
            </div>

            <button class="w-full flex items-center justify-center gap-2 px-4 py-3 bg-navy-900 text-white font-medium rounded-lg hover:bg-slate-800 transition-colors focus:ring-4 focus:ring-slate-200 outline-none" type="submit">
              <i data-lucide="shield-check" class="w-5 h-5"></i> Verify & Log In
            </button>
          </form>
          
        </div>
      </section>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
  </script>
  </body>
</html>
