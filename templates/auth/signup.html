<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=/signup/account" />
  <title>RustToGold | Open Account</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">

    <section class="max-w-md rounded-3xl border border-slate-200 bg-white p-8 text-center shadow-xl">
      <img class="mx-auto h-14 w-14 object-contain" src="/static/images/rusttogold-logo.png" alt="RustToGold" />
      <h1 class="mt-5 text-2xl font-extrabold tracking-tight text-[#071B33]">Opening your account application</h1>

      <a class="mt-6 inline-flex rounded-full bg-[#D6A54A] px-5 py-3 text-sm font-bold text-[#071B33]" href="/signup/account">Continue</a>
    </section>
  </main>

</html>
