<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin{% endblock %} · Rust to Gold</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .admin-layout {
      display: flex;
      min-height: 100vh;
    }

    .admin-sidebar {
      width: 220px;
      flex-shrink: 0;
      background: #111827;
      color: #e5e7eb;
      padding: 1.25rem 0;
      display: flex;
      flex-direction: column;
    }

    .admin-sidebar .brand {
      padding: 0 1.25rem 1.25rem 1.25rem;
      font-weight: 700;
      font-size: 1.05rem;
      color: #fff;
      border-bottom: 1px solid #1f2937;
      margin-bottom: 1rem;
    }

    .admin-sidebar nav {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      flex: 1;
    }

    .admin-sidebar nav a {
      padding: 0.55rem 1.25rem;
      color: #9ca3af;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .admin-sidebar nav a:hover {
      background: #1f2937;
      color: #fff;
    }

    .admin-sidebar nav a.active {
      background: #1f2937;
      color: #fff;
      border-left: 3px solid #2563eb;
      padding-left: calc(1.25rem - 3px);
    }

    .admin-sidebar .sidebar-footer {
      padding: 1rem 1.25rem 0 1.25rem;
      border-top: 1px solid #1f2937;
      margin-top: 1rem;
    }

    .admin-sidebar .sidebar-footer a {
      color: #9ca3af;
      font-size: 0.85rem;
      text-decoration: none;
    }

    .admin-sidebar .sidebar-footer a:hover {
      color: #fff;
    }

    .admin-main {
      flex: 1;
      min-width: 0;
      padding: 1.75rem 2rem;
    }

    .admin-content {
      max-width: 1200px;
      margin: 0 auto;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="brand">Rust to Gold · Admin</div>
      <nav>
        <a href="/admin/accounts">Accounts</a>
        <a href="/admin/staff">Staff</a>
        <a href="/admin/fixed-deposits">Fixed Deposits</a>
        <a href="/admin/fixed-deposit-plans">Fixed Deposit Plans</a>
        <a href="/admin/audit-log">Audit Log</a>
        <a href="/admin/transactions">Transactions</a>
      </nav>
      <div class="sidebar-footer">
        <a href="/logout">Log out</a>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-content">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
</body>
</html>
