{% block content %}
{% if staff.is_some() %}
  <h1>Edit Staff Member</h1>
{% else %}
  <h1>New Staff Member</h1>
{% endif %}

{% if has_error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}

{% if let Some(s) = staff %}
  <form method="POST" action="/admin/staff/{{ s.id }}">
{% else %}
  <form method="POST" action="/admin/staff">
{% endif %}

  <div class="field">
    <label>Full Name</label>
    <input type="text" name="full_name"
           value="{% if let Some(s) = staff %}{{ s.full_name }}{% endif %}"
           required>
  </div>

  <div class="field">
    <label>Email</label>
    <input type="email" name="email"
           value="{% if let Some(s) = staff %}{{ s.email }}{% endif %}"
           required>
  </div>

  <div class="field">
    <label>Phone Number</label>
    <input type="text" name="phone_number"
           value="{% if let Some(s) = staff %}{{ s.phone_number }}{% endif %}"
           required>
  </div>

  <div class="field">
    <label>Date of Birth</label>
    <input type="date" name="date_of_birth"
           value="{% if let Some(s) = staff %}{{ s.date_of_birth }}{% endif %}"
           required>
  </div>

  <div class="field">
    <label>Status</label>
      <select name="status">
        <option value="active"
          {% if let Some(s) = staff %}{% if s.status == "active" %}selected{% endif %}
          {% else %}selected{% endif %}>
          Active
        </option>
        <option value="suspended"
          {% if let Some(s) = staff %}{% if s.status == "suspended" %}selected{% endif %}{% endif %}>
          Suspended
        </option>
        <option value="closed"
          {% if let Some(s) = staff %}{% if s.status == "closed" %}selected{% endif %}{% endif %}>
          Closed
        </option>
      </select>
  </div>

  <div class="field">
    <label>
      Password
      {% if staff.is_some() %}
        <span>(leave blank to keep current)</span>
      {% endif %}
    </label>
    <input type="password" name="password"
           {% if staff.is_none() %}required{% endif %}
           minlength="8">
  </div>

  <button type="submit">
    {% if staff.is_some() %}Save Changes{% else %}Create Staff Member{% endif %}
  </button>
  <a href="/admin/staff">Cancel</a>

</form>
{% endblock %}
