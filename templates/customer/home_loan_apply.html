<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RustToGold | Apply for Home Loan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="customer-body">
  <header class="customer-topbar"><div class="customer-container customer-topbar__inner"><a class="customer-brand" href="/customer/dashboard"><span class="customer-brand__logo"><img src="/static/images/rusttogold-logo.png" alt="" /></span><span>RustToGold</span></a><div class="customer-topbar__actions"><a class="customer-pill" href="/customer/home-loans"><i data-lucide="home"></i> Home Loans</a><a class="customer-pill customer-pill--danger" href="/logout"><i data-lucide="log-out"></i> Logout</a></div></div></header>
  <main class="customer-main"><div class="customer-container customer-narrow"><a class="back-link" href="/customer/home-loans"><i data-lucide="arrow-left"></i> Back to home loans</a><section class="customer-card form-card"><div class="customer-card__header"><div><p class="customer-kicker">Home Loan</p><h1>Apply for Home Loan</h1><p>Submit a property financing application for admin review.</p></div></div><div class="customer-card__body">
    {% if has_error %}<div class="alert alert--danger"><i data-lucide="circle-alert"></i> {{ error }}</div>{% endif %}
    <form class="form clean-form" action="/customer/home-loans/apply" method="post">
      <div class="form-field"><label class="form-label" for="property_type">Property Type</label><select class="form-select" id="property_type" name="property_type" required><option value="HDB Flat">HDB Flat</option><option value="Executive Condominium">Executive Condominium</option><option value="Condominium">Condominium</option><option value="Landed Property">Landed Property</option></select></div>
      <div class="form-grid"><div class="form-field"><label class="form-label" for="property_value">Property Value</label><input class="form-input" id="property_value" name="property_value" placeholder="e.g. 650000.00" required /></div><div class="form-field"><label class="form-label" for="down_payment">Down Payment</label><input class="form-input" id="down_payment" name="down_payment" placeholder="e.g. 150000.00" required /></div></div>
      <div class="form-field"><label class="form-label" for="term_years">Loan Term</label><select class="form-select" id="term_years" name="term_years" required><option value="10">10 years</option><option value="15">15 years</option><option value="20">20 years</option><option value="25">25 years</option><option value="30">30 years</option></select></div>
      <button class="c-button c-button--primary" type="submit"><i data-lucide="home"></i> Submit Application</button>
    </form>
  </div></section></div></main>
  <script src="https://unpkg.com/lucide@latest"></script><script src="/static/js/app.js"></script>
</body>
</html>
