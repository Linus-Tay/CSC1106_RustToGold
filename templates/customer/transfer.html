<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RustToGold | Transfer Money</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="customer-body">
  <header class="customer-topbar">
    <div class="customer-container customer-topbar__inner">
      <a class="customer-brand" href="/customer/dashboard"><span class="customer-brand__logo"><img src="/static/images/rusttogold-logo.png" alt="" /></span><span>RustToGold</span></a>
      <div class="customer-topbar__actions"><a class="customer-pill" href="/customer/dashboard"><i data-lucide="layout-dashboard"></i> Dashboard</a><a class="customer-pill customer-pill--danger" href="/logout"><i data-lucide="log-out"></i> Logout</a></div>
    </div>
  </header>

  <main class="customer-main">
    <div class="customer-container customer-narrow">
      <a class="back-link" href="/customer/dashboard"><i data-lucide="arrow-left"></i> Back to dashboard</a>
      <section class="customer-card form-card">
        <div class="customer-card__header">
          <div>
            <p class="customer-kicker">Everyday Banking</p>
            <h1>Transfer Money</h1>
            <p>Send money to another RustToGold account number.</p>
          </div>
          <div class="mini-balance"><span>Available</span><strong>${{ balance }}</strong><small>From {{ account_number }}</small></div>
        </div>
        <div class="customer-card__body">
          {% if has_error %}<div class="alert alert--danger"><i data-lucide="circle-alert"></i> {{ error }}</div>{% endif %}

          <form class="form clean-form" action="/customer/transfer" method="post">
            <input type="hidden" name="account_number" value="{{ account_number }}" />
            <input type="hidden" name="method" value="local" />
            <div class="form-field">
              <label class="form-label" for="recipient_info">Recipient Account Number</label>
              <input class="form-input" id="recipient_info" name="recipient_info" placeholder="7282-1234567-8" required />
            </div>
            <div class="form-field">
              <label class="form-label" for="amount">Transfer Amount</label>
              <input class="form-input" id="amount" name="amount" inputmode="decimal" placeholder="e.g. 250.00" required />
            </div>
            <div class="form-field">
              <label class="form-label" for="note">Transfer Note</label>
              <input class="form-input" id="note" name="note" placeholder="Rent, meal split, allowance..." />
            </div>
            <button class="c-button c-button--primary" type="submit"><i data-lucide="send"></i> Send Transfer</button>
          </form>
        </div>
      </section>
    </div>
  </main>
  <script src="https://unpkg.com/lucide@latest"></script><script src="/static/js/app.js"></script>
</body>
</html>
